<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松田観劇カレンダー</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101719">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<script src="assets/register-sw.js" defer></script>
</head>
<body>
<header class="masthead">
  <a class="brand" href="./"><span>松田観劇カレンダー</span></a>
  <p class="lead">気になる公演を集め、次に見るものを探すための観劇手帖。<a href="https://t.co/EUlUPtGV4T" target="_blank" rel="noopener">Googleカレンダー</a>から毎日更新。</p>
</header>
<nav class="site-nav" aria-label="メインナビゲーション">
  <a href="./" aria-current="page">予定</a>
  <a href="proposals.html">提案</a>
  <a href="follows.html">フォロー</a>
  <a href="digest.html">傾向</a>
</nav>

<section id="pulse" class="pulse" aria-label="更新状況"><p class="loading">更新状況を読み込み中…</p></section>

<div class="sticky-bar">
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="now" role="tab" aria-selected="true">これから</button>
    <button class="tab" data-view="archive" role="tab" aria-selected="false">過去</button>
    <button class="tab" data-view="companies" role="tab" aria-selected="false">劇団別</button>
    <button class="tab" data-view="venues" role="tab" aria-selected="false">会場別</button>
  </nav>
  <input id="search" type="search" placeholder="タイトル・劇団・会場で検索" autocomplete="off">
</div>

<details class="filter-disclosure" id="date-disclosure">
  <summary>日程で絞り込む</summary>
  <div class="filter-body">
    <div class="datefilter">
      <label class="datelabel">期間</label>
      <input id="date-from" type="date" aria-label="開始日">
      <span class="datesep">〜</span>
      <input id="date-to" type="date" aria-label="終了日">
      <button id="date-clear" hidden>クリア</button>
    </div>
    <div class="months">
      <span class="datelabel" id="months-year"></span>
      <div class="month-btns" id="month-btns"></div>
    </div>
  </div>
</details>

<main id="app">
  <p class="loading">読み込み中…</p>
</main>

<button id="to-top" aria-label="上へ戻る" hidden>↑</button>

<footer>
  <p id="meta"></p>
  <p class="foot-link"><a href="https://x.com/zooom_zooom_" target="_blank" rel="noopener">@zooom_zooom_</a></p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
